<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ёжик и ночь / Кто там в темноте?</title>
<link rel="stylesheet" href="../layout.css">
<style>
  /* Screen-only chrome, same look as the editor. The printed geometry
     (grid, rotation, fold/cut lines) comes entirely from layout.css. */
  body {
    background: #e5e5e5;
    padding: 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8mm;
    font-family: sans-serif;
  }

  .sheet {
    background: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  }

  .sheet-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2mm;
  }

  .sheet-label {
    font-size: 13px;
    font-weight: bold;
    color: #444;
  }

  .cell-inner {
    padding: 3mm;
  }

  /* Every page is drawn in a 660x960 box, close to the 68.25 x 99 mm
     area left inside the 3mm padding. */
  .page {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  @media print {
    body {
      background: #fff;
      padding: 0;
      display: block;
    }

    .no-print {
      display: none !important;
    }

    .sheet {
      box-shadow: none;
    }
  }
</style>
</head>
<body>

<!--
  Artwork. Each page is a <g id="..."> drawn in a 660x960 box, in normal
  reading orientation; the cells below just <use> it and layout.css rotates
  it into place. Spreads (pages 4|5 and 12|13) are drawn once in a 1320x960
  box, and each of the two cells shows its half through its own viewBox.

  Text inside <use> clones doesn't inherit from the page, so every page
  group carries its own font attributes.

  Comic A (front, pages 1-8):  a-1 a-2 a-3 a-45 a-6 a-7 a-8
  Comic B (back, pages 9-16):  b-1 b-2 b-3 b-45 b-6 b-7 b-8
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <!-- ===== Gradients and patterns ===== -->
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d2b53"/>
    <stop offset=".55" stop-color="#6b4b8a"/>
    <stop offset="1" stop-color="#f6a96b"/>
  </linearGradient>
  <radialGradient id="glowY">
    <stop offset="0" stop-color="#fff59d" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#fff59d" stop-opacity=".25"/>
    <stop offset="1" stop-color="#fff59d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowG">
    <stop offset="0" stop-color="#eeff8a" stop-opacity=".8"/>
    <stop offset=".45" stop-color="#eeff8a" stop-opacity=".25"/>
    <stop offset="1" stop-color="#eeff8a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowO">
    <stop offset="0" stop-color="#ffcf70" stop-opacity=".8"/>
    <stop offset=".5" stop-color="#ffb74d" stop-opacity=".28"/>
    <stop offset="1" stop-color="#ffb74d" stop-opacity="0"/>
  </radialGradient>
  <pattern id="stones" width="120" height="70" patternUnits="userSpaceOnUse">
    <rect width="120" height="70" fill="#3a2645"/>
    <g fill="#4b3257" stroke="#2c1c36" stroke-width="3">
      <rect x="4" y="4" width="70" height="28" rx="8"/>
      <rect x="78" y="4" width="38" height="28" rx="8"/>
      <rect x="4" y="38" width="36" height="28" rx="8"/>
      <rect x="44" y="38" width="72" height="28" rx="8"/>
    </g>
  </pattern>

  <!-- ===== Shared props ===== -->
  <g id="star">
    <path d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z" fill="#fff8dc"/>
  </g>

  <!-- Firefly light, centred on the origin. -->
  <g id="spark">
    <circle r="20" fill="url(#glowG)"/>
    <circle r="5" fill="#f4ff81"/>
  </g>

  <!-- Firefly, facing left, glowing tail at the origin, ~50 wide. -->
  <g id="firefly" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <circle r="40" fill="url(#glowG)" stroke="none"/>
    <ellipse cx="-14" cy="-3" rx="15" ry="10" fill="#3b3b58"/>
    <circle cx="0" cy="0" r="10" fill="#f4ff81"/>
    <circle cx="-30" cy="-6" r="8" fill="#3b3b58"/>
    <circle cx="-33" cy="-8" r="2.5" fill="#fff" stroke="none"/>
    <path d="M-32 -13 Q-36 -24 -44 -24 M-28 -13 Q-28 -26 -20 -28" fill="none" stroke-width="2.5"/>
    <ellipse cx="-8" cy="-16" rx="12" ry="7" fill="#fff" opacity=".8" transform="rotate(-25 -8 -16)"/>
  </g>

  <!-- Fir tree silhouette, origin at the bottom centre, 150 tall; colour from `color`. -->
  <path id="fir" d="M0 -150 L26 -100 L12 -100 L40 -50 L20 -50 L52 0 L-52 0 L-20 -50 L-40 -50 L-12 -100 L-26 -100 Z" fill="currentColor"/>

  <!-- Lantern, origin at the top of the handle, 76 tall. Glass takes `color`. -->
  <g id="lantern" stroke="#222" stroke-width="5" stroke-linejoin="round">
    <path d="M-14 14 Q0 -14 14 14" fill="none"/>
    <rect x="-22" y="10" width="44" height="12" rx="3" fill="#c0392b"/>
    <rect x="-17" y="22" width="34" height="42" rx="4" fill="currentColor"/>
    <rect x="-22" y="64" width="44" height="12" rx="3" fill="#c0392b"/>
  </g>

  <!-- Candle on a dish, origin at the bottom centre, ~80 tall. -->
  <g id="candle" stroke="#222" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="0" cy="0" rx="26" ry="8" fill="#c9a15b"/>
    <rect x="-10" y="-50" width="20" height="48" rx="3" fill="#fff4e0"/>
    <path d="M0 -50 L0 -56" fill="none" stroke-width="3"/>
    <path d="M0 -80 Q12 -62 0 -54 Q-12 -62 0 -80 Z" fill="#ffb300" stroke-width="3"/>
    <path d="M0 -70 Q5 -62 0 -58 Q-5 -62 0 -70 Z" fill="#fff59d" stroke="none"/>
  </g>

  <!-- Barrel, origin at the bottom centre, 130 x 172. -->
  <g id="barrel" stroke="#222" stroke-width="6" stroke-linejoin="round">
    <path d="M-55 0 Q-72 -80 -55 -160 L55 -160 Q72 -80 55 0 Z" fill="#a0643a"/>
    <path d="M-20 -2 Q-26 -80 -20 -158 M20 -2 Q26 -80 20 -158" fill="none" stroke="#7a4a2a" stroke-width="4"/>
    <path d="M-59 -30 Q0 -22 59 -30 M-59 -130 Q0 -122 59 -130" fill="none" stroke="#4a3020" stroke-width="8"/>
    <ellipse cx="0" cy="-160" rx="55" ry="12" fill="#7a4a2a"/>
  </g>

  <g id="apple" stroke="#222" stroke-width="3" stroke-linejoin="round">
    <circle r="14" fill="#e0463a"/>
    <path d="M0 -13 L2 -22" fill="none"/>
    <path d="M2 -20 Q12 -26 16 -18 Q8 -14 2 -20 Z" fill="#7ccf6a" stroke-width="2"/>
  </g>

  <!-- ===== Tishka the hedgehog, ~250x208, facing right, feet at y=208. =====
       Face parts are separate; arm props (lantern, candle, apple) too. -->
  <g id="tish" stroke="#222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="82" cy="198" rx="24" ry="10" fill="#4a2f1a"/>
    <ellipse cx="150" cy="198" rx="24" ry="10" fill="#4a2f1a"/>
    <path d="M24 158 L-4 157 L18 139 L-9 131 L17 119 L-7 104 L21 100 L2 79 L30 82 L16 57 L43 67 L36 39 L59 56 L59 27 L78 49 L85 21 L98 47 L112 22 L117 50 L137 30 L135 58 L160 44 L151 71 L178 63 L163 86 L191 86 L170 105 L182 165 L60 190 Z" fill="#6b4526"/>
    <path d="M32 132 L52 120 M44 94 L62 88 M76 64 L88 76 M118 60 L116 76" fill="none" stroke="#8a5d38" stroke-width="4"/>
    <ellipse cx="120" cy="166" rx="62" ry="34" fill="#e8c9a0"/>
    <circle cx="132" cy="78" r="13" fill="#e8c9a0"/>
    <ellipse cx="160" cy="118" rx="50" ry="44" fill="#f1d8b0" stroke-width="10"/>
    <ellipse cx="200" cy="132" rx="32" ry="20" fill="#f1d8b0" stroke-width="10"/>
    <ellipse cx="160" cy="118" rx="50" ry="44" fill="#f1d8b0" stroke="none"/>
    <ellipse cx="200" cy="132" rx="32" ry="20" fill="#f1d8b0" stroke="none"/>
    <circle cx="228" cy="128" r="10" fill="#222"/>
    <circle cx="225" cy="124" r="3" fill="#fff" stroke="none"/>
    <circle cx="148" cy="142" r="9" fill="#f28b82" opacity=".6" stroke="none"/>
  </g>
  <g id="tish-eyes">
    <circle cx="156" cy="106" r="7" fill="#222"/>
    <circle cx="186" cy="102" r="7" fill="#222"/>
    <circle cx="158" cy="103" r="2.5" fill="#fff"/>
    <circle cx="188" cy="99" r="2.5" fill="#fff"/>
  </g>
  <g id="tish-eyes-wide" stroke="#222" stroke-width="4">
    <circle cx="154" cy="104" r="13" fill="#fff"/>
    <circle cx="186" cy="100" r="13" fill="#fff"/>
    <circle cx="157" cy="106" r="5" fill="#222" stroke="none"/>
    <circle cx="189" cy="102" r="5" fill="#222" stroke="none"/>
  </g>
  <path id="tish-eyes-closed" d="M146 106 Q156 114 166 106 M176 102 Q186 110 196 102" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <path id="tish-eyes-happy" d="M146 110 Q156 98 166 110 M176 106 Q186 94 196 106" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <path id="tish-smile" d="M190 144 Q202 152 214 142" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <ellipse id="tish-o" cx="204" cy="146" rx="7" ry="8" fill="#7a2e2e" stroke="#222" stroke-width="3"/>
  <path id="tish-wobble" d="M186 146 q5 -5 10 0 t10 0 t10 0" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  <path id="tish-laugh" d="M188 140 Q204 162 220 138 Z" fill="#7a2e2e" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Arm holding the lantern; glass colour from the <use>'s `color`. -->
  <g id="tish-lantern" stroke-linecap="round">
    <path d="M160 168 L236 152" stroke="#222" stroke-width="22"/>
    <path d="M160 168 L236 152" stroke="#4a2f1a" stroke-width="12"/>
    <use href="#lantern" transform="translate(240 146) scale(.7)"/>
    <circle cx="238" cy="150" r="10" fill="#4a2f1a" stroke="#222" stroke-width="5"/>
  </g>
  <path id="tish-flame" d="M240 165 Q247 176 240 186 Q233 176 240 165 Z" fill="#ff9800" stroke="#222" stroke-width="2"/>

  <!-- Arm holding a candle; flame centre at (236,132). -->
  <g id="tish-candle" stroke-linecap="round">
    <path d="M160 168 L232 160" stroke="#222" stroke-width="22"/>
    <path d="M160 168 L232 160" stroke="#4a2f1a" stroke-width="12"/>
    <use href="#candle" transform="translate(236 184) scale(.8)"/>
    <circle cx="236" cy="162" r="10" fill="#4a2f1a" stroke="#222" stroke-width="5"/>
  </g>

  <g id="tish-apple" stroke-linecap="round">
    <path d="M160 168 L216 166" stroke="#222" stroke-width="22"/>
    <path d="M160 168 L216 166" stroke="#4a2f1a" stroke-width="12"/>
    <use href="#apple" transform="translate(238 172) scale(1.3)"/>
    <circle cx="220" cy="168" r="10" fill="#4a2f1a" stroke="#222" stroke-width="5"/>
  </g>

  <!-- ===== Mouse, facing left, origin at the bottom centre, ~125 tall. =====
       #mouse-sil is a flat silhouette in `color` (also used for shadows). -->
  <g id="mouse-sil" fill="currentColor">
    <path d="M26 -12 Q70 -4 72 -40 Q74 -70 56 -78" fill="none" stroke="currentColor" stroke-width="6"/>
    <ellipse cx="-14" cy="-3" rx="12" ry="5"/>
    <ellipse cx="14" cy="-3" rx="12" ry="5"/>
    <ellipse cx="0" cy="-34" rx="30" ry="34"/>
    <circle cx="-34" cy="-100" r="16"/>
    <circle cx="6" cy="-104" r="16"/>
    <ellipse cx="-38" cy="-72" rx="14" ry="10"/>
    <circle cx="-12" cy="-78" r="27"/>
  </g>
  <g id="mouse-arms-up" fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M-18 -52 L-58 -110 M16 -54 L46 -118" stroke-width="14"/>
    <path d="M-58 -110 l-18 -8 M-58 -110 l-8 -18 M-58 -110 l8 -18 M46 -118 l-6 -20 M46 -118 l10 -16 M46 -118 l20 -4" stroke-width="7"/>
  </g>
  <g id="mouse">
    <path d="M26 -12 Q70 -4 72 -40 Q74 -70 56 -78" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>
    <use href="#mouse-sil" color="#b7aec4" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="-6" cy="-28" rx="16" ry="20" fill="#e6e0ec"/>
    <circle cx="-36" cy="-104" r="8" fill="#f2a7b4"/>
    <circle cx="6" cy="-110" r="8" fill="#f2a7b4"/>
    <circle cx="-52" cy="-73" r="4.5" fill="#e57a8a" stroke="#222" stroke-width="2"/>
  </g>
  <g id="mouse-eyes">
    <circle cx="-26" cy="-84" r="4.5" fill="#222"/>
    <circle cx="-8" cy="-86" r="4.5" fill="#222"/>
    <circle cx="-25" cy="-86" r="1.5" fill="#fff"/>
    <circle cx="-7" cy="-88" r="1.5" fill="#fff"/>
  </g>
  <g id="mouse-eyes-wide" stroke="#222" stroke-width="2.5">
    <circle cx="-27" cy="-85" r="8" fill="#fff"/>
    <circle cx="-7" cy="-87" r="8" fill="#fff"/>
    <circle cx="-29" cy="-84" r="3.5" fill="#222" stroke="none"/>
    <circle cx="-9" cy="-86" r="3.5" fill="#222" stroke="none"/>
  </g>
  <path id="mouse-eyes-happy" d="M-31 -83 Q-26 -90 -21 -83 M-13 -85 Q-8 -92 -3 -85" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path id="mouse-smile" d="M-48 -66 Q-42 -61 -36 -66" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse id="mouse-o" cx="-42" cy="-63" rx="3.5" ry="4.5" fill="#7a2e2e" stroke="#222" stroke-width="2"/>
  <!-- Arm holding a small candle; flame centre at (-56,-43). -->
  <g id="mouse-hold" stroke-linecap="round">
    <path d="M-14 -46 L-50 -30" stroke="#222" stroke-width="11"/>
    <path d="M-14 -46 L-50 -30" stroke="#b7aec4" stroke-width="5"/>
    <use href="#candle" transform="translate(-56 -12) scale(.5)"/>
    <circle cx="-52" cy="-28" r="5" fill="#b7aec4" stroke="#222" stroke-width="3"/>
  </g>
  <g id="mouse-apple" stroke-linecap="round">
    <path d="M-14 -46 L-42 -40" stroke="#222" stroke-width="11"/>
    <path d="M-14 -46 L-42 -40" stroke="#b7aec4" stroke-width="5"/>
    <use href="#apple" transform="translate(-56 -40) scale(.9)"/>
    <circle cx="-44" cy="-40" r="5" fill="#b7aec4" stroke="#222" stroke-width="3"/>
  </g>

  <!-- ===== Comic No. 3: Ёжик и ночь (pages 1-8) ===== -->

  <!-- Page 1: front cover -->
  <g id="a-1" font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', cursive" font-weight="700" stroke-linejoin="round" stroke-linecap="round">
    <svg x="10" y="10" width="640" height="940">
      <rect width="640" height="940" fill="#1d2b53"/>
      <use href="#star" x="470" y="210"/>
      <use href="#star" x="600" y="260"/>
      <use href="#star" x="80" y="340"/>
      <use href="#star" x="300" y="330"/>
      <use href="#star" x="580" y="480"/>
      <use href="#star" x="40" y="520"/>
      <use href="#star" x="200" y="430"/>
      <circle cx="470" cy="370" r="56" fill="#fff3c4" stroke="#222" stroke-width="5"/>
      <circle cx="497" cy="350" r="50" fill="#1d2b53"/>
      <g color="#16223f">
        <use href="#fir" transform="translate(40 850) scale(1.6)"/>
        <use href="#fir" transform="translate(170 855) scale(1.1)"/>
        <use href="#fir" transform="translate(450 855) scale(1.2)"/>
        <use href="#fir" transform="translate(570 850) scale(1.8)"/>
      </g>
      <rect y="840" width="640" height="100" fill="#13202f"/>
      <path d="M0 840 L640 840" stroke="#222" stroke-width="5"/>
      <circle cx="486" cy="800" r="250" fill="url(#glowY)"/>
      <use href="#spark" x="330" y="500"/>
      <use href="#spark" x="600" y="610"/>
      <use href="#spark" x="60" y="640"/>
      <use href="#spark" x="250" y="560"/>
      <g transform="translate(90 518) scale(1.65)">
        <use href="#tish"/><use href="#tish-lantern" color="#fff176"/><use href="#tish-flame"/>

      </g>
      <text x="40" y="150" font-size="130" fill="#f4ff81" stroke="#222" stroke-width="12" paint-order="stroke">ЁЖИК</text>
      <text x="40" y="266" font-size="110" fill="#f4ff81" stroke="#222" stroke-width="12" paint-order="stroke">И НОЧЬ</text>
      <circle cx="570" cy="84" r="50" fill="#4a6fa5" stroke="#222" stroke-width="6"/>
      <text x="570" y="96" font-size="32" text-anchor="middle" fill="#fff">No.3</text>
      <text x="320" y="905" font-size="30" text-anchor="middle" fill="#f4ff81">ИСТОРИЯ ПРО ТИШКУ</text>
    </svg>
    <rect x="10" y="10" width="640" height="940" fill="none" stroke="#222" stroke-width="7"/>
  </g>

  <!-- Page 2: setup -->
  <g id="a-2" font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', cursive" font-weight="700" stroke-linejoin="round" stroke-linecap="round">
    <svg x="10" y="10" width="640" height="440">
      <rect width="640" height="440" fill="url(#dusk)"/>
      <use href="#star" x="600" y="40"/>
      <use href="#star" x="330" y="130"/>
      <circle cx="110" cy="410" r="70" fill="#ffb86b" stroke="#222" stroke-width="5"/>
      <rect y="405" width="640" height="40" fill="#2f4a3a"/>
      <path d="M0 405 L640 405" stroke="#222" stroke-width="5"/>
      <path d="M300 445 Q380 190 660 170 L660 445 Z" fill="#2f4a3a" stroke="#222" stroke-width="6"/>
      <path d="M470 445 L470 360 A45 45 0 0 1 560 360 L560 445 Z" fill="#6b4526" stroke="#222" stroke-width="6"/>
      <circle cx="545" cy="400" r="6" fill="#ffd23f" stroke="#222" stroke-width="3"/>
      <circle cx="430" cy="330" r="22" fill="#ffd54f" stroke="#222" stroke-width="5"/>
      <path d="M408 330 L452 330 M430 308 L430 352" stroke="#222" stroke-width="4"/>

      </g>
      <rect x="16" y="16" width="540" height="56" fill="#fff3b0" stroke="#222" stroke-width="5"/>
      <text x="32" y="54" font-size="30" fill="#222">Ёжик Тишка боялся темноты.</text>
    </svg>
    <rect x="10" y="10" width="640" height="440" fill="none" stroke="#222" stroke-width="7"/>

    <svg x="10" y="470" width="640" height="480">
      <rect width="640" height="480" fill="#5a4030"/>
      <path d="M0 60 Q120 90 200 40 M380 20 Q450 80 640 60 M0 330 Q60 300 110 340" fill="none" stroke="#4a3526" stroke-width="10"/>
      <circle cx="540" cy="300" r="70" fill="#1d2b53" stroke="#222" stroke-width="7"/>
      <use href="#star" x="515" y="280"/>
      <path d="M470 300 L610 300 M540 230 L540 370" stroke="#222" stroke-width="6"/>

    </svg>
    <rect x="10" y="470" width="640" height="480" fill="none" stroke="#222" stroke-width="7"/>
  </g>

  <!-- Page 3: the lantern goes out -->
  <g id="a-3" font-family="'Comic Sans MS', 'Comic Neue', 'Chalkboard SE', cursive" font-weight="700" stroke-linejoin="round" stroke-linecap="round">
    <svg x="10" y="10" width="640" height="460">
      <rect width="640" height="460" fill="#14203f"/>
      <use href="#star" x="470" y="50"/>
      <use href="#star" x="600" y="140"/>
      <use href="#star" x="560" y="40"/>
      <use href="#star" x="80" y="160"/>
      <g color="#1b2a4a">
        <use href="#fir" transform="translate(40 330) scale(1.5)"/>
        <use href="#fir" transform="translate(150 330) scale(1.2)"/>
        <use href="#fir" transform="translate(360 330) scale(1.4)"/>
        <use href="#fir" transform="translate(590 330) scale(1.6)"/>
      </g>
      <rect y="320" width="640" height="140" fill="#1a2a33"/>
      <path d="M0 320 L640 320" stroke="#222" stroke-width="5"/>
      <ellipse cx="320" cy="400" rx="360" ry="40" fill="#22363f"/>
      <circle cx="448" cy="352" r="120" fill="url(#glowY)" opacity=".6"/>
      <g transform="translate(220 185) scale(.95)">
        <use href="#tish"/><use href="#tish-lantern" color="#fff59d"/><use href="#tish-flame"/>
        <use href="#tish-eyes"/><use href="#tish-wobble"/>
      </g>
      <path d="M474 322 l14 -10 M480 352 l18 0 M474 382 l14 10" stroke="#fff59d" stroke-width="4"/>
